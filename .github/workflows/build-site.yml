name: Build static WASM site

on:
  push:
    branches: [main]
    paths-ignore:
      - data/ingredients.json
      - data/pantry.json
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Validate recipes and build registry
        run: |
          mkdir -p dist/data
          python3 tools/build_registry.py \
            --out dist/data/meals.json \
            --ingredients-out dist/data/ingredients.json \
            --pantry-out dist/data/pantry.json

      - name: Stage header-only dependency for WASM
        run: |
          mkdir -p third_party
          cp -R /usr/include/nlohmann third_party/nlohmann

      - name: Build WebAssembly planner
        run: |
          emcmake cmake -S . -B build-wasm
          cmake --build build-wasm --config Release
          cp build-wasm/mealplanner.js dist/mealplanner.js
          cp build-wasm/mealplanner.wasm dist/mealplanner.wasm

      - name: Copy web assets
        run: cp -R web/. dist/

      - name: Native tests
        run: |
          cmake -S . -B build-native
          cmake --build build-native --config Release
          ctest --test-dir build-native --output-on-failure

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
