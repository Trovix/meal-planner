name: Build shopping list

on:
  workflow_dispatch:
    inputs:
      meals:
        description: 'Optional comma-separated meal IDs. Leave blank for random selection.'
        required: false
        default: ''
        type: string
      random_count:
        description: 'Number of random unique meals when meals is blank'
        required: false
        default: '3'
        type: string
      request_id:
        description: 'Unique request ID from Shortcut'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shopping-list
  cancel-in-progress: false

jobs:
  build-shopping-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev

      - name: Build C++ engine
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Generate shopping list
        env:
          MEALS: ${{ inputs.meals }}
          RANDOM_COUNT: ${{ inputs.random_count }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [ -n "$MEALS" ]; then
            ./build/mealplanner "$MEALS" "$REQUEST_ID"
          else
            ./build/mealplanner --random-count "$RANDOM_COUNT" "$REQUEST_ID"
          fi

      - name: Commit latest result
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest.json
          git commit -m "Generate shopping list ${REQUEST_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
