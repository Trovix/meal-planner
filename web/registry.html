<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffefd">
  <title>Registry · Meal Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <nav class="nav">
      <a href="./">Planner</a>
      <a href="registry.html" aria-current="page">Registry</a>
      <a href="add-recipe.html">Add recipe</a>
      <a href="https://james-platt.com/">James Platt</a>
    </nav>

    <div class="fade" id="content">
      <h1>Full Registry</h1>
      <div class="filter-controls" id="meal-type-filters" aria-label="Filter recipes by meal type">
        <button class="button secondary is-active" type="button" data-meal-type="" aria-pressed="true">All</button>
        <button class="button secondary" type="button" data-meal-type="breakfast" aria-pressed="false">Breakfast</button>
        <button class="button secondary" type="button" data-meal-type="lunch" aria-pressed="false">Lunch</button>
        <button class="button secondary" type="button" data-meal-type="dinner" aria-pressed="false">Dinner</button>
      </div>
      <p class="status" id="status" aria-live="polite">Loading recipes…</p>
      <div class="recipe-list" id="registry"></div>
    </div>
  </main>

  <script src="site.js"></script>
  <script src="recipe-view.js"></script>
  <script src="registry.js"></script>
</body>
</html>
