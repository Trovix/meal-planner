<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffefd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Meal Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <nav class="nav">
      <a href="./" aria-current="page">Planner</a>
      <a href="registry.html">Registry</a>
      <a href="add-recipe.html">Add recipe</a>
      <a href="https://james-platt.com/">James Platt</a>
    </nav>

    <div class="fade" id="content">
      <h1>Meal Planner</h1>
      <div class="field planner-meal-type">
        <label for="meal-type">Recipes to roll</label>
        <select id="meal-type">
          <option value="dinner" selected>Dinner</option>
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="">All meal types</option>
        </select>
      </div>
      <div class="controls">
        <button class="button" id="generate" disabled>Roll for three dinners</button>
        <a class="button secondary" href="registry.html">View full registry</a>
      </div>
      <p class="muted">
        To use <strong>Add to Reminders</strong>, you must first set up the
        <a href="https://github.com/Trovix/meal-planner#iphone-shortcut-setup">Add Shopping List shortcut locally on your iPhone</a>.
      </p>
      <p class="status" id="status" aria-live="polite">Loading C++ planner…</p>

      <section id="result" class="hidden">
        <h2 id="result-heading">Dinners</h2>
        <div class="recipe-list" id="meals"></div>
        <div class="summary" id="macro-summary"></div>
      </section>
    </div>
  </main>

  <script src="mealplanner.js"></script>
  <script src="site.js"></script>
  <script src="recipe-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
